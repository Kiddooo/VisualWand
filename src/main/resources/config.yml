# Wand settings
wand:
  material: BLAZE_ROD
  name: "&6✦ &eArchitect's Wand &6✦"
  lore:
    - "&7"
    - "&fRMB on object &8→ &bSelect and open editor"
    - "&fChoose a click-editing mode in Transformations"
    - "&fLMB &8→ &aIncrease &7| &fRMB &8→ &cDecrease"
    - "&fDrop wand &8→ &eReopen mode menu"
    - "&fShift + RMB &8→ &cDelete object"
    - "&7"
    - "&8Plugin by MiniGames.Cafe"

# Read-only particle gizmo rendering for active click-editing modes
gizmo:
  particle-density: 20
  size: 1.5
  update-interval: 2
  colors:
    x-axis: [255, 0, 0]
    y-axis: [0, 255, 0]
    z-axis: [0, 0, 255]
    scale: [255, 255, 0]
    rotation: [255, 0, 255]

# Centralized display editor settings
editor:
  max-distance: 50.0

  targeting:
    highlight-enabled: true
    update-interval: 2
    cycle-range: 8.0

  steps:
    translation:
      fine: 0.01
      normal: 0.1
      coarse: 1.0
    rotation-degrees:
      fine: 1.0
      normal: 5.0
      coarse: 15.0
    scale:
      fine: 0.01
      normal: 0.1
      coarse: 0.5

  scale:
    minimum-magnitude: 0.01
    maximum-magnitude: 100.0

  input:
    initial-delay-ticks: 6
    repeat-interval-ticks: 2
    release-gap-ticks: 8

  feedback:
    update-interval-ticks: 10
    glow-selected: true

# Animation settings
animations:
  tick-rate: 2
  presets:
    slow-rotation:
      type: ROTATION
      speed: 1.0
      axis: Y
    levitation:
      type: LEVITATION
      height: 0.5
      speed: 0.02
    pulsing:
      type: SCALE
      min-scale: 0.9
      max-scale: 1.1
      speed: 0.01
